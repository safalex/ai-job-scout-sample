[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-scout-sample"
version = "0.1.0"
description = "Public sample: requirement-level RAG and evidence coverage for job–CV matching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.10.0",
  "numpy>=2.1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
